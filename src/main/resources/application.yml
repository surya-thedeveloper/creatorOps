# =========================================================================
# CreatorOps Global Spring Boot Configuration
# =========================================================================

spring:
  application:
    name: creatorops-backend

  profiles:
    active: default  # Default profile executes with in-memory H2 database

  # -------------------------------------------------------------------------
  # DEFAULT PROFILE CONFIGURATION (In-Memory H2 for local execution/tests)
  # -------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:creatorops;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # Hibernate generates H2 tables dynamically based on Java entities
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false  # Disabled for default H2 profile to avoid Postgres trigger/function errors

# -------------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------------
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [correlationId=%X{correlationId}] [userId=%X{userId}] [organizationId=%X{organizationId}] [entityId=%X{entityId}] - %msg%n"

# -------------------------------------------------------------------------
# Spring Actuator and Info Configuration
# -------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: CreatorOps Backend
    description: Content Operations Platform Backend
    version: 1.0.0
    stage: production-ready

# -------------------------------------------------------------------------
# AI Rate Limiting (Bucket4j Config)
# -------------------------------------------------------------------------
creatorops:
  ai:
    rate-limit:
      capacity: ${AI_RATE_LIMIT_CAPACITY:5}
      refill-tokens: 5
      refill-duration-minutes: 1
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-1.5-flash

# -------------------------------------------------------------------------
# Security / JWT Configuration
# Defaults are safe for local/test only — must be overridden in production.
# -------------------------------------------------------------------------
security:
  jwt:
    secret-key: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3VmaWNpZW50bHktbG9uZy1zZWNyZXQta2V5LXRvLXVzZS1mb3Itand0LXNpZ25pbmc=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# -------------------------------------------------------------------------
# OpenAPI / Swagger Configuration
# -------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false

---

# -------------------------------------------------------------------------
# POSTGRES PROFILE CONFIGURATION (Production/Real DB integration)
# -------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:creatorops}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Hibernate only validates matching schemas on startup
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true  # Flyway runs initial V1 DDL migration script on startup
    baseline-on-migrate: true
